<!DOCTYPE html>
<html>
<head>
   
   <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            margin: 0;
            padding-top: 50px;
        }

        .calculator {
            width: 320px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #764ba2;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            border: 2px solid #667eea;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            color: #764ba2;
        }

        button {
            width: 60px;
            height: 45px;
            margin: 5px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:nth-of-type(1) {
            background-color: #28a745;
        }

        button:nth-of-type(2) {
            background-color: #dc3545;
        }

        button:nth-of-type(3) {
            background-color: #0075ff;
        }

        button:nth-of-type(4) {
            background-color: #ff9800;
        }

        button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background-color: #f1f345;
            color: #333;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter the first number">
        <input type="number" id="num2" placeholder="Enter the second number">

        <br>

        <button onclick="add()">+</button>
        <button onclick="subtraction()">-</button>
        <button onclick="multiplication()">*</button>
        <button onclick="divide()">/</button>

        <h3 id="result">Result:</h3>
    </div>

    <script>
        function add() {
            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let result = number1 + number2;

            document.getElementById("result").innerHTML = "Result: " + result;
        }

        function subtraction() {
            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let result = number1 - number2;

            document.getElementById("result").innerHTML = "Result: " + result;
        }

        function multiplication() {
            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let result = number1 * number2;

            document.getElementById("result").innerHTML = "Result: " + result;
        }

        function divide() {
            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            if (number2 === 0) {
                document.getElementById("result").innerHTML =
                    "Cannot divide by zero";
            } else {
                let result = number1 / number2;

                document.getElementById("result").innerHTML =
                    "Result: " + result;
            }
        }
    </script>

</body>
</html>
